<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon SMP — AdminPanel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e12;
    --bg-2: #14171d;
    --panel: #191c23;
    --panel-2: #21252e;
    --panel-3: #2a2f3a;
    --slot: #262a33;
    --slot-border-lt: #3d4451;
    --slot-border-dk: #0a0b0e;
    --accent: #5be07a;
    --accent-2: #3ecf8e;
    --accent-glow: rgba(91,224,122,0.35);
    --accent-dim: #1f5a3a;
    --gold: #e8c15c;
    --danger: #ef5a5a;
    --danger-dim: #7a2c2c;
    --warn: #e0b355;
    --text: #eef0f3;
    --text-dim: #8b93a3;
    --text-faint: #5a6272;
    --border: rgba(255,255,255,0.06);
    --font: 'Inter', system-ui, sans-serif;
    --font-display: 'Press Start 2P', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    height: 100vh; overflow: hidden;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(91,224,122,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(62,207,142,0.04), transparent 45%);
  }
  #login-screen {
    height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column;
    position: relative; overflow: hidden;
  }
  #login-screen::before {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(circle at 50% 40%, black, transparent 70%);
  }
  #login-screen .box {
    position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel));
    padding: 36px 32px; border-radius: 14px; border: 1px solid var(--border);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 20px 60px rgba(0,0,0,0.5), 0 0 40px var(--accent-glow);
    width: 340px;
  }
  #login-screen .logo-badge {
    width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 18px;
    background: linear-gradient(145deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  #login-screen h1 {
    text-align: center; font-family: var(--font-display); font-size: 15px; letter-spacing: 1px;
    color: var(--text); margin-bottom: 8px; line-height: 1.6;
  }
  #login-screen h1 span { color: var(--accent); display: block; font-size: 11px; margin-top: 6px; }
  #login-screen p.sub { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 0; margin-bottom: 26px; }
  input, select, button, textarea {
    font-family: var(--font); font-size: 13.5px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--slot); color: var(--text); padding: 11px 13px; width: 100%;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  }
  button {
    cursor: pointer; background: linear-gradient(180deg, var(--accent), var(--accent-2));
    border: none; color: #072414; font-weight: 700; letter-spacing: 0.2px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 4px 12px rgba(91,224,122,0.2);
  }
  button:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  button:hover { filter: brightness(1.12); }
  button.danger { background: linear-gradient(180deg, #e06060, #c23f3f); color: #fff; box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 4px 12px rgba(224,96,96,0.2); }
  button.secondary { background: var(--panel-3); color: var(--text); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  label { font-size: 11px; color: var(--text-dim); display: block; margin: 12px 0 5px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }
  #error-msg { color: var(--danger); font-size: 12px; margin-top: 12px; min-height: 14px; text-align: center; }

  #app { display: none; height: 100vh; grid-template-columns: 272px 1fr; grid-template-rows: 56px 1fr; }
  #app.active { display: grid; }
  #topbar {
    grid-column: 1 / 3; background: linear-gradient(180deg, var(--panel-2), var(--panel)); display: flex; align-items: center; padding: 0 20px;
    border-bottom: 1px solid var(--border); justify-content: space-between;
  }
  #topbar .brand { display: flex; align-items: center; gap: 10px; }
  #topbar .brand .icon {
    width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(145deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center; font-size: 15px; box-shadow: 0 3px 10px var(--accent-glow);
  }
  #topbar .brand .names { line-height: 1.15; }
  #topbar .brand .server-name { font-weight: 800; font-size: 14px; letter-spacing: 0.2px; }
  #topbar .brand .sub-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; }
  #status-pill {
    display: flex; align-items: center; gap: 7px; background: var(--panel-3); padding: 6px 12px 6px 10px;
    border-radius: 20px; border: 1px solid var(--border);
  }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--danger);
    box-shadow: 0 0 8px var(--danger);
  }
  #status-dot.connected { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); animation: pulse-dot 2s infinite; }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  #status-text { font-size: 12px; color: var(--text-dim); font-weight: 500; }

  #sidebar { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 14px 10px; }
  #sidebar-label {
    font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 10px; padding: 0 6px;
    font-weight: 700; letter-spacing: 0.6px; display: flex; justify-content: space-between; align-items: center;
  }
  #sidebar-label .count-badge {
    background: var(--accent-dim); color: var(--accent); padding: 1px 8px; border-radius: 10px; font-size: 10.5px;
  }
  .player-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; cursor: pointer; margin-bottom: 3px;
    border: 1px solid transparent; transition: background .12s, border-color .12s;
  }
  .player-row:hover { background: var(--panel-2); }
  .player-row.selected { background: linear-gradient(90deg, rgba(91,224,122,0.12), transparent); border-color: rgba(91,224,122,0.3); }
  .player-row .avatar {
    width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(145deg, var(--panel-3), var(--slot));
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--accent);
    flex-shrink: 0; border: 1px solid var(--border);
  }
  .player-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; box-shadow: 0 0 5px var(--accent-glow); }
  .player-row .name { flex: 1; font-size: 13px; font-weight: 500; }
  .player-row .hp { font-size: 11px; color: var(--danger); font-weight: 600; }
  #main-content { padding: 24px; overflow-y: auto; }
  #empty-state { color: var(--text-faint); text-align: center; margin-top: 120px; font-size: 13px; }
  #empty-state .big { font-size: 34px; margin-bottom: 10px; }

  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px;
    border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .card h3 {
    margin: 0 0 14px; font-size: 11.5px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.8px;
    display: flex; align-items: center; gap: 8px; font-weight: 700;
  }
  .player-title { font-size: 17px; font-weight: 800; margin: 0 0 2px; display: flex; align-items: center; gap: 10px; }
  .player-title .uuid-tag { color: var(--text-faint); font-weight: 400; font-size: 11px; font-family: monospace; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .stat { background: var(--panel-3); padding: 12px 14px; border-radius: 9px; border: 1px solid var(--border); }
  .stat .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 600; letter-spacing: 0.4px; }
  .stat .value { font-size: 17px; font-weight: 800; margin-top: 3px; }
  .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 9px; }
  .action-grid button { padding: 11px; font-size: 12.5px; }

  /* Minecraft-style inventory */
  .inv-section-title {
    font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; margin: 16px 0 8px;
    font-weight: 700; letter-spacing: 0.5px;
  }
  .slot-grid { display: grid; gap: 5px; }
  .slot-grid.hotbar { grid-template-columns: repeat(9, 44px); }
  .slot-grid.main { grid-template-columns: repeat(9, 44px); }
  .slot-grid.armor { grid-template-columns: repeat(4, 44px); }
  .slot-grid.offhand { grid-template-columns: 44px; }
  .slot-grid.enderchest { grid-template-columns: repeat(9, 44px); }
  .slot {
    width: 44px; height: 44px; background: linear-gradient(180deg, #2c313c, var(--slot)); border-radius: 6px;
    border: 1px solid; border-color: var(--slot-border-lt) var(--slot-border-dk) var(--slot-border-dk) var(--slot-border-lt);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer;
    transition: transform .1s, box-shadow .1s;
  }
  .slot:hover { background: linear-gradient(180deg, #363c49, #303541); box-shadow: inset 0 1px 3px rgba(0,0,0,0.4), 0 0 0 2px var(--accent-glow); transform: translateY(-1px); }
  .slot img { width: 32px; height: 32px; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
  .slot .fallback { width: 26px; height: 26px; background: linear-gradient(145deg, #6b7280, #4b5160); border-radius: 3px; }
  .slot .amount {
    position: absolute; bottom: 1px; right: 3px; font-size: 11px; font-weight: 800;
    color: #fff; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
  }

  /* Item browser modal */
  #item-browser-overlay {
    display: none; position: fixed; inset: 0; background: rgba(6,7,10,0.72); backdrop-filter: blur(3px); z-index: 50;
    align-items: center; justify-content: center;
  }
  #item-browser-overlay.active { display: flex; }
  #item-browser {
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); width: 660px; max-height: 80vh; border-radius: 14px;
    border: 1px solid var(--border); box-shadow: 0 24px 70px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #item-browser .ib-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
  #item-browser .ib-header input { flex: 1; }
  #item-browser .ib-header button { width: auto; padding: 10px 14px; }
  #item-browser .ib-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .ib-category { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; margin: 12px 0 7px; font-weight: 700; letter-spacing: 0.5px; }
  .ib-grid { display: grid; grid-template-columns: repeat(8, 44px); gap: 5px; }
  .ib-item {
    width: 44px; height: 44px; background: var(--slot); border: 1px solid var(--border); cursor: pointer;
    display:flex; align-items:center; justify-content:center; border-radius: 6px; transition: transform .1s;
  }
  .ib-item:hover { outline: 2px solid var(--accent); transform: translateY(-1px); }
  .ib-item img { width: 30px; height: 30px; image-rendering: pixelated; }
  #item-browser .ib-footer { padding: 14px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; background: var(--panel-2); }
  #item-browser .ib-footer label { margin: 0; white-space: nowrap; }
  #item-browser .ib-footer input { width: 80px; }
  #item-browser .ib-footer button { width: auto; padding: 11px 18px; }
  #selected-item-preview { font-size: 12px; color: var(--text-dim); flex: 1; }

  #item-editor-overlay { display: none; position: fixed; inset: 0; background: rgba(6,7,10,0.72); backdrop-filter: blur(3px); z-index: 60; align-items: center; justify-content: center; }
  #item-editor-overlay.active { display: flex; }
  #item-editor {
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); width: 400px; border-radius: 14px;
    border: 1px solid var(--border); padding: 20px; box-shadow: 0 24px 70px rgba(0,0,0,0.6);
  }
  #item-editor h3 { margin-top: 0; color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
  #item-editor .row { display: flex; gap: 10px; }
  #item-editor .row > div { flex: 1; }
  #item-editor textarea { min-height: 60px; resize: vertical; }
  #item-editor .actions { display: flex; gap: 10px; margin-top: 16px; }
  #item-editor .actions button { width: auto; flex: 1; padding: 11px; }

  #console-log {
    background: #08090b; color: var(--accent); font-family: 'Consolas', monospace; font-size: 12px;
    padding: 12px; border-radius: 8px; height: 140px; overflow-y: auto; white-space: pre-wrap; border: 1px solid var(--border);
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="box">
    <div class="logo-badge">⛏</div>
    <h1>HORIZON SMP<span>ADMIN CONTROL PANEL</span></h1>
    <p class="sub">Sign in to manage the live server</p>
    <label>Backend URL</label>
    <input id="backend-url" placeholder="https://your-backend.example.com" value="http://localhost:8080">
    <label>Panel Password</label>
    <input id="login-pass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()">
    <button style="margin-top:18px" onclick="doLogin()">Enter Panel →</button>
    <div id="error-msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <div class="brand">
      <div class="icon">⛏</div>
      <div class="names">
        <div class="server-name">Horizon SMP</div>
        <div class="sub-label">Admin Control Panel</div>
      </div>
    </div>
    <div id="status-pill"><span id="status-dot"></span><span id="status-text">Connecting…</span></div>
  </div>
  <div id="sidebar">
    <div id="sidebar-label">
      <span>Online Players</span>
      <span class="count-badge" id="player-count">0</span>
    </div>
    <div id="player-list"></div>
  </div>
  <div id="main-content">
    <div id="empty-state"><div class="big">🧭</div>Select a player from the list to manage them.</div>
    <div id="player-detail" style="display:none"></div>
  </div>
</div>

<!-- ITEM BROWSER -->
<div id="item-browser-overlay">
  <div id="item-browser">
    <div class="ib-header">
      <input id="ib-search" placeholder="Search items…" oninput="renderItemBrowser()">
      <button class="secondary" style="width:auto" onclick="closeItemBrowser()">✕</button>
    </div>
    <div class="ib-body" id="ib-body"></div>
    <div class="ib-footer">
      <div id="selected-item-preview">No item selected</div>
      <label style="margin:0">Amount</label>
      <input id="ib-amount" type="number" min="1" max="64" value="1">
      <button onclick="confirmItemPick()">Place in Slot</button>
    </div>
  </div>
</div>

<!-- ITEM DATA EDITOR (name/lore/enchants/custom model data/potion) -->
<div id="item-editor-overlay">
  <div id="item-editor">
    <h3 id="item-editor-title">Edit Item</h3>
    <label>Display Name</label>
    <input id="ie-name" placeholder="(default)">
    <label>Lore (one line per row)</label>
    <textarea id="ie-lore" placeholder="Line 1&#10;Line 2"></textarea>
    <div class="row">
      <div>
        <label>Custom Model Data</label>
        <input id="ie-cmd" type="number" placeholder="(none)">
      </div>
      <div>
        <label>Damage / Durability used</label>
        <input id="ie-damage" type="number" placeholder="0">
      </div>
    </div>
    <label>Enchantments (id:level, comma separated — e.g. sharpness:5,unbreaking:3)</label>
    <input id="ie-enchants" placeholder="sharpness:5,unbreaking:3">
    <div class="actions">
      <button class="secondary" style="width:auto" onclick="closeItemEditor()">Cancel</button>
      <button onclick="applyItemEditor()">Apply to Slot</button>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------
// State
// ---------------------------------------------------------------------
let API_BASE = '';
let TOKEN = '';
let ws = null;
let players = {};        // uuid -> summary/detail
let selectedUuid = null;
let itemCatalog = [];
let pendingSlot = null;   // {inventoryType, slot} the item browser/editor is targeting
let pendingItem = null;   // item json currently being placed/edited

// ---------------------------------------------------------------------
// Auth
// ---------------------------------------------------------------------
async function doLogin() {
  const url = document.getElementById('backend-url').value.replace(/\/$/, '');
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('error-msg');
  errEl.textContent = '';
  try {
    const res = await fetch(url + '/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    if (!res.ok) { const j = await res.json().catch(()=>({})); throw new Error(j.error || 'Login failed'); }
    const data = await res.json();
    API_BASE = url;
    TOKEN = data.token;
    localStorage.setItem('ap_base', API_BASE);
    localStorage.setItem('ap_token', TOKEN);
    enterApp();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  loadItemCatalog();
  connectWs();
  refreshPlayers();
}

async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN, ...(opts.headers||{}) }
  });
  if (!res.ok) {
    const j = await res.json().catch(()=>({error: res.statusText}));
    throw new Error(j.error || 'Request failed');
  }
  return res.json();
}

// ---------------------------------------------------------------------
// Live WebSocket connection to backend (dashboard channel)
// ---------------------------------------------------------------------
function connectWs() {
  const wsUrl = API_BASE.replace(/^http/, 'ws') + '/dashboard-ws?token=' + encodeURIComponent(TOKEN);
  ws = new WebSocket(wsUrl);
  ws.onopen = () => setStatus(true);
  ws.onclose = () => { setStatus(false); setTimeout(connectWs, 4000); };
  ws.onerror = () => setStatus(false);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'player_list') {
      players = {};
      for (const p of msg.players) players[p.uuid] = p;
      renderPlayerList();
      if (selectedUuid && players[selectedUuid]) renderPlayerDetailSummary();
    } else if (msg.type === 'player_update') {
      players[msg.player.uuid] = { ...players[msg.player.uuid], ...msg.player };
      renderPlayerList();
      if (selectedUuid === msg.player.uuid) renderFullPlayerDetail(msg.player);
    } else if (msg.type === 'player_left') {
      delete players[msg.uuid];
      renderPlayerList();
      if (selectedUuid === msg.uuid) {
        selectedUuid = null;
        document.getElementById('player-detail').style.display = 'none';
        document.getElementById('empty-state').style.display = 'block';
      }
    } else if (msg.type === 'server_status') {
      setStatus(msg.connected, msg.connected ? 'Plugin connected' : 'Plugin offline');
    }
  };
}

function setStatus(connected, label) {
  document.getElementById('status-dot').classList.toggle('connected', connected);
  document.getElementById('status-text').textContent = label || (connected ? 'Live' : 'Disconnected');
}

async function refreshPlayers() {
  try {
    const data = await api('/api/players');
    for (const p of data.players) players[p.uuid] = p;
    renderPlayerList();
  } catch (e) { console.error(e); }
}

// ---------------------------------------------------------------------
// Player list
// ---------------------------------------------------------------------
function renderPlayerList() {
  const list = document.getElementById('player-list');
  const arr = Object.values(players);
  document.getElementById('player-count').textContent = arr.length;
  list.innerHTML = '';
  arr.sort((a,b) => a.name.localeCompare(b.name)).forEach(p => {
    const row = document.createElement('div');
    row.className = 'player-row' + (p.uuid === selectedUuid ? ' selected' : '');
    row.onclick = () => selectPlayer(p.uuid);
    row.innerHTML = `
      <span class="avatar">${escapeHtml((p.name||'?').slice(0,1).toUpperCase())}</span>
      <span class="dot"></span>
      <span class="name">${escapeHtml(p.name)}${p.frozen ? ' 🧊' : ''}</span>
      <span class="hp">${Math.round(p.health)}❤</span>
    `;
    list.appendChild(row);
  });
}

async function selectPlayer(uuid) {
  selectedUuid = uuid;
  renderPlayerList();
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('player-detail').style.display = 'block';
  try {
    const data = await api('/api/players/' + uuid);
    if (data.ok) renderFullPlayerDetail(data.player);
  } catch (e) { console.error(e); }
}

function renderPlayerDetailSummary() {
  if (selectedUuid && players[selectedUuid]) {
    selectPlayer(selectedUuid); // re-fetch full detail (summary alone lacks inventory)
  }
}

// ---------------------------------------------------------------------
// Full player detail: stats + actions + inventory editor
// ---------------------------------------------------------------------
function renderFullPlayerDetail(p) {
  players[p.uuid] = { ...players[p.uuid], ...p };
  const el = document.getElementById('player-detail');
  el.innerHTML = `
    <div class="card">
      <div class="player-title"><span class="avatar" style="width:34px;height:34px;font-size:15px;">${escapeHtml((p.name||'?').slice(0,1).toUpperCase())}</span>${escapeHtml(p.name)}</div>
      <div class="uuid-tag" style="margin-bottom:14px">${p.uuid}</div>
      <div class="stat-grid">
        <div class="stat"><div class="label">Health</div><div class="value">${p.health?.toFixed(1)} / ${p.maxHealth?.toFixed(0)}</div></div>
        <div class="stat"><div class="label">Food</div><div class="value">${p.food}</div></div>
        <div class="stat"><div class="label">Level / XP</div><div class="value">${p.level} (${Math.round((p.exp||0)*100)}%)</div></div>
        <div class="stat"><div class="label">Gamemode</div><div class="value">${p.gamemode}</div></div>
        <div class="stat"><div class="label">World</div><div class="value">${p.world}</div></div>
        <div class="stat"><div class="label">Location</div><div class="value" style="font-size:12px">${p.x?.toFixed(0)}, ${p.y?.toFixed(0)}, ${p.z?.toFixed(0)}</div></div>
        <div class="stat"><div class="label">OP</div><div class="value">${p.op ? 'Yes' : 'No'}</div></div>
        <div class="stat"><div class="label">Frozen</div><div class="value">${p.frozen ? 'Yes' : 'No'}</div></div>
      </div>
    </div>

    <div class="card">
      <h3>⚡ Actions</h3>
      <div class="action-grid">
        <button onclick="promptTeleport('${p.uuid}')">Teleport</button>
        <button onclick="cycleGamemode('${p.uuid}','${p.gamemode}')">Gamemode: ${p.gamemode}</button>
        <button onclick="toggleOp('${p.uuid}', ${!p.op})">${p.op ? 'De-OP' : 'OP'}</button>
        <button onclick="toggleFreeze('${p.uuid}', ${!p.frozen})">${p.frozen ? 'Unfreeze' : 'Freeze'}</button>
        <button class="danger" onclick="quickAction('${p.uuid}','kick')">Kick</button>
        <button class="danger" onclick="quickAction('${p.uuid}','ban')">Ban</button>
        <button class="secondary" onclick="quickAction('${p.uuid}','unban')">Unban</button>
        <button class="danger" onclick="confirmClearInventory('${p.uuid}')">Clear Inventory</button>
      </div>
      <label>Run command as this context (console)</label>
      <div style="display:flex;gap:8px">
        <input id="console-cmd" placeholder="say hello, gamemode creative ${p.name}, etc.">
        <button style="width:140px" onclick="runConsoleCommand()">Execute</button>
      </div>
    </div>

    <div class="card">
      <h3>🎒 Inventory Editor</h3>
      <div class="inv-section-title">Armor</div>
      <div class="slot-grid armor" id="grid-armor"></div>
      <div class="inv-section-title">Hotbar</div>
      <div class="slot-grid hotbar" id="grid-hotbar"></div>
      <div class="inv-section-title">Main Inventory</div>
      <div class="slot-grid main" id="grid-main"></div>
      <div class="inv-section-title">Offhand</div>
      <div class="slot-grid offhand" id="grid-offhand"></div>
      <div class="inv-section-title">Ender Chest</div>
      <div class="slot-grid enderchest" id="grid-enderchest"></div>
    </div>
  `;

  buildInventoryGrids(p);
}

// mainInventory[] from Bukkit is 0-8 hotbar, 9-35 main storage (36 total)
function buildInventoryGrids(p) {
  const hotbar = document.getElementById('grid-hotbar');
  const main = document.getElementById('grid-main');
  hotbar.innerHTML = ''; main.innerHTML = '';
  (p.mainInventory || []).forEach((item, i) => {
    const slotEl = makeSlot(item, i < 9 ? 'main' : 'main', i, p.uuid);
    (i < 9 ? hotbar : main).appendChild(slotEl);
  });

  const armor = document.getElementById('grid-armor');
  armor.innerHTML = '';
  // Bukkit getArmorContents(): [boots, leggings, chestplate, helmet] — reorder for display (helmet first)
  const labels = ['Boots','Leggings','Chestplate','Helmet'];
  const order = [3,2,1,0];
  order.forEach(idx => armor.appendChild(makeSlot((p.armor||[])[idx], 'armor', idx, p.uuid)));

  const offhand = document.getElementById('grid-offhand');
  offhand.innerHTML = '';
  offhand.appendChild(makeSlot(p.offhand, 'offhand', 0, p.uuid));

  const ender = document.getElementById('grid-enderchest');
  ender.innerHTML = '';
  (p.enderChest || []).forEach((item, i) => ender.appendChild(makeSlot(item, 'enderchest', i, p.uuid)));
}

function makeSlot(item, inventoryType, slot, uuid) {
  const div = document.createElement('div');
  div.className = 'slot';
  const isAir = !item || item.amount === 0 || item.id === 'minecraft:air';
  if (!isAir) {
    const catalogEntry = itemCatalog.find(c => c.id === item.id);
    if (catalogEntry) {
      const img = document.createElement('img');
      img.src = catalogEntry.icon;
      img.onerror = () => { img.replaceWith(fallbackSwatch()); };
      div.appendChild(img);
    } else {
      div.appendChild(fallbackSwatch());
    }
    if (item.amount > 1) {
      const amt = document.createElement('div');
      amt.className = 'amount';
      amt.textContent = item.amount;
      div.appendChild(amt);
    }
    div.title = (item.name || item.id) + ' x' + item.amount;
  }
  div.onclick = (e) => {
    if (e.shiftKey && !isAir) {
      removeSlot(uuid, inventoryType, slot);
    } else {
      openItemBrowser(uuid, inventoryType, slot, isAir ? null : item);
    }
  };
  return div;
}
function fallbackSwatch() { const d = document.createElement('div'); d.className = 'fallback'; return d; }

async function removeSlot(uuid, inventoryType, slot) {
  try { await api(`/api/players/${uuid}/remove-slot`, { method: 'POST', body: JSON.stringify({ slot, inventoryType }) }); }
  catch (e) { alert(e.message); }
}

// ---------------------------------------------------------------------
// Item Browser (Creative-style)
// ---------------------------------------------------------------------
async function loadItemCatalog() {
  try {
    const data = await api('/api/items');
    itemCatalog = data.items;
  } catch (e) { console.error('Failed to load item catalog', e); }
}

function openItemBrowser(uuid, inventoryType, slot, existingItem) {
  pendingSlot = { uuid, inventoryType, slot };
  pendingItem = existingItem ? { ...existingItem } : null;
  document.getElementById('item-browser-overlay').classList.add('active');
  document.getElementById('ib-search').value = '';
  renderItemBrowser();
  updateSelectedPreview();
}
function closeItemBrowser() { document.getElementById('item-browser-overlay').classList.remove('active'); }

function renderItemBrowser() {
  const q = document.getElementById('ib-search').value.toLowerCase();
  const body = document.getElementById('ib-body');
  body.innerHTML = '';
  const filtered = itemCatalog.filter(i => !q || i.name.toLowerCase().includes(q) || i.id.includes(q));
  const byCat = {};
  filtered.forEach(i => { (byCat[i.category] = byCat[i.category] || []).push(i); });
  Object.entries(byCat).forEach(([cat, items]) => {
    const label = document.createElement('div');
    label.className = 'ib-category';
    label.textContent = cat;
    body.appendChild(label);
    const grid = document.createElement('div');
    grid.className = 'ib-grid';
    items.forEach(item => {
      const cell = document.createElement('div');
      cell.className = 'ib-item';
      cell.title = item.name;
      const img = document.createElement('img');
      img.src = item.icon;
      img.onerror = () => img.replaceWith(fallbackSwatch());
      cell.appendChild(img);
      cell.onclick = () => {
        pendingItem = { id: item.id, amount: parseInt(document.getElementById('ib-amount').value) || 1 };
        updateSelectedPreview();
      };
      grid.appendChild(cell);
    });
    body.appendChild(grid);
  });
}
function updateSelectedPreview() {
  const el = document.getElementById('selected-item-preview');
  el.textContent = pendingItem ? `Selected: ${pendingItem.id}` : 'No item selected';
}

function confirmItemPick() {
  if (!pendingItem) { closeItemBrowser(); return; }
  pendingItem.amount = parseInt(document.getElementById('ib-amount').value) || 1;
  closeItemBrowser();
  openItemEditor();
}

// ---------------------------------------------------------------------
// Item data editor (name / lore / enchants / custom model data / potion)
// ---------------------------------------------------------------------
function openItemEditor() {
  document.getElementById('item-editor-title').textContent = 'Edit: ' + pendingItem.id;
  document.getElementById('ie-name').value = pendingItem.name || '';
  document.getElementById('ie-lore').value = (pendingItem.lore || []).join('\n');
  document.getElementById('ie-cmd').value = pendingItem.customModelData ?? '';
  document.getElementById('ie-damage').value = pendingItem.damage ?? '';
  document.getElementById('ie-enchants').value = (pendingItem.enchantments || [])
    .map(e => e.id.replace('minecraft:','') + ':' + e.level).join(',');
  document.getElementById('item-editor-overlay').classList.add('active');
}
function closeItemEditor() { document.getElementById('item-editor-overlay').classList.remove('active'); }

async function applyItemEditor() {
  const name = document.getElementById('ie-name').value.trim();
  const lore = document.getElementById('ie-lore').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const cmd = document.getElementById('ie-cmd').value.trim();
  const damage = document.getElementById('ie-damage').value.trim();
  const enchStr = document.getElementById('ie-enchants').value.trim();

  const item = { id: pendingItem.id, amount: pendingItem.amount || 1 };
  if (name) item.name = name;
  if (lore.length) item.lore = lore;
  if (cmd !== '') item.customModelData = parseInt(cmd);
  if (damage !== '') item.damage = parseInt(damage);
  if (enchStr) {
    item.enchantments = enchStr.split(',').map(pair => {
      const [id, level] = pair.split(':').map(s => s.trim());
      return { id: 'minecraft:' + id, level: parseInt(level) || 1 };
    });
  }

  try {
    await api(`/api/players/${pendingSlot.uuid}/set-slot`, {
      method: 'POST',
      body: JSON.stringify({ slot: pendingSlot.slot, inventoryType: pendingSlot.inventoryType, item })
    });
    closeItemEditor();
  } catch (e) { alert(e.message); }
}

// ---------------------------------------------------------------------
// Quick actions
// ---------------------------------------------------------------------
async function quickAction(uuid, action) {
  if ((action === 'kick' || action === 'ban') && !confirm(`Are you sure you want to ${action} this player?`)) return;
  const reason = (action === 'kick' || action === 'ban') ? prompt('Reason (optional):', '') : undefined;
  try { await api(`/api/players/${uuid}/${action}`, { method: 'POST', body: JSON.stringify({ reason }) }); }
  catch (e) { alert(e.message); }
}
async function confirmClearInventory(uuid) {
  if (!confirm('Clear this player\\'s ENTIRE inventory (including armor)?')) return;
  try { await api(`/api/players/${uuid}/clear-inventory`, { method: 'POST' }); }
  catch (e) { alert(e.message); }
}
async function toggleOp(uuid, op) {
  try { await api(`/api/players/${uuid}/op`, { method: 'POST', body: JSON.stringify({ op }) }); }
  catch (e) { alert(e.message); }
}
async function toggleFreeze(uuid, frozen) {
  try { await api(`/api/players/${uuid}/freeze`, { method: 'POST', body: JSON.stringify({ frozen }) }); }
  catch (e) { alert(e.message); }
}
async function cycleGamemode(uuid, current) {
  const order = ['SURVIVAL','CREATIVE','ADVENTURE','SPECTATOR'];
  const next = order[(order.indexOf(current) + 1) % order.length];
  try { await api(`/api/players/${uuid}/gamemode`, { method: 'POST', body: JSON.stringify({ gamemode: next }) }); }
  catch (e) { alert(e.message); }
}
async function promptTeleport(uuid) {
  const coords = prompt('Enter target coordinates as "x y z":', '0 100 0');
  if (!coords) return;
  const [x,y,z] = coords.split(/\s+/).map(Number);
  if ([x,y,z].some(isNaN)) { alert('Invalid coordinates'); return; }
  try { await api(`/api/players/${uuid}/teleport`, { method: 'POST', body: JSON.stringify({ x, y, z }) }); }
  catch (e) { alert(e.message); }
}
async function runConsoleCommand() {
  const cmd = document.getElementById('console-cmd').value.trim();
  if (!cmd) return;
  try { await api('/api/console/execute', { method: 'POST', body: JSON.stringify({ command: cmd }) }); document.getElementById('console-cmd').value=''; }
  catch (e) { alert(e.message); }
}

function escapeHtml(s) { return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------------------------------------------------------------------
// Auto-login if a token is already stored
// ---------------------------------------------------------------------
(function tryAutoLogin() {
  const savedBase = localStorage.getItem('ap_base');
  const savedToken = localStorage.getItem('ap_token');
  if (savedBase && savedToken) {
    API_BASE = savedBase; TOKEN = savedToken;
    document.getElementById('backend-url').value = savedBase;
    enterApp();
  }
})();
</script>
